<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduler UTI — Hospital Británico</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #F1F5F9;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #0F172A;
      }
      textarea { font-family: inherit; }
      ::-webkit-scrollbar { height: 10px; width: 10px; }
      ::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 8px; }
      ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748B; }
      .print-only, .print-only-block { display: none; }
      @page { size: A4 landscape; margin: 8mm; }
      @media print {
        body { background: #fff; }
        .no-print { display: none !important; }
        .print-only { display: inline; }
        .print-only-block { display: block; }
      }
    </style>
  </head>
